<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script do Sobrevivow</title>
    <link rel="icon" type="image/x-icon" href="Imagens/icone.ico">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pubg: {
                            gold: '#ffd700',
                            amber: '#f59e0b',
                            red: '#dc2626',
                            darkRed: '#450a0a',
                            dark: '#050508',
                        }
                    },
                    fontFamily: {
                        pubg: ['Teko', 'sans-serif'],
                        tech: ['Rajdhani', 'sans-serif'],
                        code: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050508;
            color: #f3f4f6;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* Glow, Borda Preta e Estilo do Titulo */
        .text-glow-survivor {
            -webkit-text-stroke: 2px #000000; /* Borda preta em volta de cada letra */
            text-shadow: 
                0 0 10px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(220, 38, 38, 0.8),
                0 0 30px rgba(245, 158, 11, 0.6);
        }

        /* Cursor Piscante do Efeito Typewriter com borda preta */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #f59e0b;
            -webkit-text-stroke: 1.5px #000000;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Molduras Táticas PUBG */
        .tactical-box {
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .tactical-btn {
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.25s ease-in-out;
        }

        .tactical-btn:hover {
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.7);
            transform: translateY(-2px);
        }

        /* Animações Sequenciais JS Observer */
        .reveal-item {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-item.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Efeito CRT / Terminal Hacker */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(220, 38, 38, 0.12) 50%,
                rgba(220, 38, 38, 0.12)
            );
            background-size: 100% 4px;
        }

        /* Scrollbar Terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(10, 10, 15, 0.9);
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.6); }
            50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.8); }
        }

        .btn-pulse {
            animation: pulseGlow 2.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative select-none">

    <!-- 1. CAMADA DE VÍDEO & TRANSIÇÃO DE IMAGEM DE FUNDO -->
    <div id="bg-container" class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
        <!-- Imagem de Fundo Permanente -->
        <div id="bg-image" 
             class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat transition-opacity duration-1000 opacity-0"
             style="background-image: url('Imagens/Fundo.png');">
        </div>

        <!-- Sombreamentos Suaves -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#050508]/80 via-black/30 to-[#050508]/40 opacity-40"></div>
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_transparent_60%,_#050508_98%)] opacity-50"></div>

        <!-- Vídeo Fullscreen Inicial -->
        <video id="intro-video" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 z-10">
            <source src="Videos/video.mp4" type="video/mp4">
            Seu navegador não suporta a execução de vídeos em HTML5.
        </video>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main id="main-content" class="relative z-20 container mx-auto px-4 py-8 max-w-4xl flex-grow flex flex-col justify-center opacity-0 transition-opacity duration-700">

        <!-- TOPO DA PÁGINA -->
        <header class="reveal-item text-center mb-10 md:mb-14">
            <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-red-950/80 border border-red-600/60 text-amber-400 text-xs font-bold tracking-widest uppercase mb-6 shadow-[0_0_15px_rgba(220,38,38,0.3)]">
                <i class="fa-solid fa-crown text-amber-400 animate-bounce"></i>Xiter dos XITERS
            </div>
            
            <!-- Título com Fira Code, Borda Preta e Gradiente Ouro/Vermelho -->
            <div class="min-h-[90px] sm:min-h-[110px] flex items-center justify-center">
                <h1 id="animated-title" class="text-5xl sm:text-7xl md:text-8xl font-code font-bold tracking-normal text-amber-400 text-glow-survivor typing-cursor normal-case">
                </h1>
            </div>
        </header>

        <!-- MEIO DA PÁGINA (SECTION MACROS) -->
        <section class="reveal-item mb-12">
            <div class="tactical-box p-6 sm:p-10 text-center relative border-t-2 border-t-amber-500/70">
                
                <h2 class="text-xl sm:text-2xl font-pubg text-gray-300 tracking-widest uppercase mb-6 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-crosshair text-red-500"></i> SELETOR DE MACROS
                </h2>

                <div class="flex items-center justify-between gap-4 max-w-md mx-auto my-6 bg-black/60 p-4 rounded-xl border border-red-900/40 shadow-inner">
                    <button onclick="prevMacro()" 
                            class="w-12 h-12 rounded-lg bg-red-950/80 border border-red-600/60 text-amber-400 hover:bg-red-600 hover:text-white flex items-center justify-center text-xl transition-all active:scale-95 shadow-lg">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <div class="flex-1 text-center min-h-[70px] flex flex-col justify-center">
                        <span id="macro-display" class="font-pubg text-4xl sm:text-5xl font-bold text-amber-400 tracking-wider text-shadow transition-all duration-200">
                            4x RPD
                        </span>
                        <span id="macro-subtitle" class="text-xs font-code text-red-400 tracking-widest uppercase mt-1">
                            Rambão 7.62mm - Média Distancia
                        </span>
                    </div>

                    <button onclick="nextMacro()" 
                            class="w-12 h-12 rounded-lg bg-red-950/80 border border-red-600/60 text-amber-400 hover:bg-red-600 hover:text-white flex items-center justify-center text-xl transition-all active:scale-95 shadow-lg">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div id="macro-dots" class="flex justify-center gap-2 mb-8"></div>

                <button onclick="openHackerModal()" 
                        class="tactical-btn btn-pulse w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-red-700 via-red-600 to-amber-600 hover:from-red-600 hover:to-amber-500 text-white font-pubg text-3xl tracking-widest uppercase font-bold shadow-2xl transition-all duration-300 flex items-center justify-center gap-3 mx-auto border-t border-amber-300/40">
                    Aplicar Xiter
                    <i class="fa-solid fa-bolt text-amber-300"></i>
                </button>

            </div>
        </section>

    </main>

    <!-- FOOTER DA PÁGINA -->
    <footer id="footer-content" class="relative z-20 reveal-item text-center py-5 border-t border-red-900/40 bg-black/85 text-xs sm:text-sm font-code text-gray-400 opacity-0 transition-opacity duration-700">
        <p class="tracking-wider flex items-center justify-center gap-2 flex-wrap">
            <span class="text-amber-400 font-bold">bL1nKZz7 2026</span>
            <span class="text-red-600">•</span>
            <span class="text-gray-400">TODOS OS DIREITOS RESERVADOS</span>
        </p>
    </footer>

    <!-- MODAL HACKER TERMINAL -->
    <div id="hacker-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="w-full max-w-xl bg-[#08080c] border-2 border-red-600 rounded-lg shadow-[0_0_50px_rgba(220,38,38,0.6)] overflow-hidden flex flex-col scanlines relative">
            
            <div class="bg-gradient-to-r from-red-950 via-black to-red-950 px-4 py-3 border-b border-red-800/60 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-700"></span>
                    <span class="font-code text-xs text-red-400 font-bold ml-2 tracking-wider">
                        script.exe
                    </span>
                </div>
                <span class="text-xs font-code text-amber-500">[PUBG KERNEL]</span>
            </div>

            <div id="terminal-logs" class="p-4 sm:p-6 font-code text-xs sm:text-sm h-72 overflow-y-auto terminal-scroll bg-black/95 space-y-2 text-red-500"></div>

            <div class="p-4 bg-black/90 border-t border-red-900/40">
                <div class="flex justify-between text-xs font-code text-amber-400 mb-1">
                    <span id="modal-status-text">STATUS: AGUARDANDO INICIALIZAÇÃO...</span>
                    <span id="modal-percent">0%</span>
                </div>
                <div class="w-full h-2 bg-gray-900 rounded-full overflow-hidden border border-red-900/40">
                    <div id="modal-progress-bar" class="h-full bg-gradient-to-r from-red-700 via-red-500 to-amber-400 w-0 transition-all duration-200"></div>
                </div>
            </div>

            <div class="bg-red-950/40 px-4 py-3 border-t border-red-900/30 flex justify-end">
                <button id="close-modal-btn" disabled onclick="closeHackerModal()" 
                        class="px-6 py-2 bg-red-950 border border-red-700 text-red-400 hover:bg-red-900 hover:text-white font-tech font-bold uppercase tracking-wider rounded text-sm transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed">
                    FECHAR CONSOLE
                </button>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- ANIMATED TYPEWRITER TITLE ---
        const titlePhrases = ["bL1nKZz7", "Top 1 do SA"];
        const titleElement = document.getElementById("animated-title");
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeLoop() {
            const currentPhrase = titlePhrases[phraseIndex];
            
            if (isDeleting) {
                titleElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                titleElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 60 : 120;

            if (!isDeleting && charIndex === currentPhrase.length) {
                typeSpeed = 2200; // Tempo de espera com o texto completo
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % titlePhrases.length;
                typeSpeed = 400; // Pausa antes de digitar a próxima frase
            }

            setTimeout(typeLoop, typeSpeed);
        }

        typeLoop();

        // --- CARROSSEL DE MACROS ---
        const macrosList = [
            { name: "4x RPD", subtitle: "Rambão 7.62mm - Média Distancia" },
            { name: "1x Beryl", subtitle: "AR 7.62mm - Curta Distancia" },
            { name: "2x Aug", subtitle: "AR 5.56mm - Média Distancia" },
            { name: "6x M416", subtitle: "AR 5.56mm - Longa Distancia" },
            { name: "3x Scar", subtitle: "AR 5.56mm - Média Distancia" },
            { name: "2x AKM", subtitle: "AR 7.62mm - Curta Distancia" },
            { name: "6x Groza", subtitle: "AR 7.62mm - Longa Distancia" },
            { name: "4x Ace", subtitle: "AR 7.62mm - Média Distancia" }
        ];

        let currentMacroIndex = 0;

        function renderDots() {
            const dotsContainer = document.getElementById('macro-dots');
            dotsContainer.innerHTML = '';
            macrosList.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${idx === currentMacroIndex ? 'bg-red-500 w-6 shadow-[0_0_8px_#dc2626]' : 'bg-gray-700'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function updateMacroDisplay() {
            const display = document.getElementById('macro-display');
            const subtitle = document.getElementById('macro-subtitle');
            
            display.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                display.innerText = macrosList[currentMacroIndex].name;
                subtitle.innerText = macrosList[currentMacroIndex].subtitle;
                display.classList.remove('opacity-0', 'scale-95');
            }, 150);

            renderDots();
        }

        function nextMacro() {
            currentMacroIndex = (currentMacroIndex + 1) % macrosList.length;
            updateMacroDisplay();
        }

        function prevMacro() {
            currentMacroIndex = (currentMacroIndex - 1 + macrosList.length) % macrosList.length;
            updateMacroDisplay();
        }

        renderDots();

        // --- VÍDEO & TRANSIÇÃO ---
        const introVideo = document.getElementById('intro-video');
        const bgImage = document.getElementById('bg-image');
        const mainContent = document.getElementById('main-content');
        const footerContent = document.getElementById('footer-content');
        let isIntroFinished = false;

        function endVideoIntro() {
            if (isIntroFinished) return;
            isIntroFinished = true;

            introVideo.classList.add('opacity-0');
            bgImage.classList.remove('opacity-0');
            bgImage.classList.add('opacity-100');

            setTimeout(() => {
                introVideo.pause();
                introVideo.style.display = 'none';
            }, 1000);

            mainContent.classList.remove('opacity-0');
            footerContent.classList.remove('opacity-0');
            initIntersectionObserver();
        }

        introVideo.addEventListener('ended', endVideoIntro);

        setTimeout(() => {
            if (!isIntroFinished) endVideoIntro();
        }, 5500);

        // --- INTERSECTION OBSERVER ---
        function initIntersectionObserver() {
            const items = document.querySelectorAll('.reveal-item');
            
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('active');
                        }, index * 200);
                        obs.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            items.forEach(item => observer.observe(item));
        }

        // --- TERMINAL MODAL ---
        const modal = document.getElementById('hacker-modal');
        const terminalLogs = document.getElementById('terminal-logs');
        const progressBar = document.getElementById('modal-progress-bar');
        const progressPercent = document.getElementById('modal-percent');
        const statusText = document.getElementById('modal-status-text');
        const closeBtn = document.getElementById('close-modal-btn');

        function openHackerModal() {
            const activeMacro = macrosList[currentMacroIndex].name;

            terminalLogs.innerHTML = `
                <div class="text-amber-400">// INICIALIZANDO CONSOLE TÁTICO bL1nKZz7...</div>
                <div class="text-gray-500">// PERFIL SELECIONADO: <span class="text-red-400 font-bold">${activeMacro}</span></div>
                <div class="text-red-600">[+] CONEXÃO COM PUBG KERNEL ESTABELECIDA.</div>
            `;

            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
            statusText.innerText = 'STATUS: INJETANDO CÓDIGOS...';
            closeBtn.disabled = true;

            modal.classList.remove('opacity-0', 'pointer-events-none');

            const logsSequence = [
                { text: "[KERNEL] HOOKING SYSTEM INPUT BUFFER... SUCCESS", color: "text-amber-400", delay: 300 },
                { text: "[BYPASS] LOAD MEMORY ADDRESS: 0x99F_SURVIVOR", color: "text-red-500", delay: 700 },
                { text: "[MACRO] BINDING RECOIL PATTERN FOR: " + activeMacro, color: "text-amber-300", delay: 1100 },
                { text: "[CALIBRATION] PITCH / Y-AXIS COMPENSATION... 100%", color: "text-red-400", delay: 1500 },
                { text: "[CALIBRATION] YAW / X-AXIS ANTI-DRIFT... 100%", color: "text-red-400", delay: 1900 },
                { text: "[SECURITY] ENCRYPTING VIRTUAL INPUTS [HUMANIZED SPRAY]", color: "text-amber-500", delay: 2400 },
                { text: "[STATUS] MACRO APLICADA COM SUCESSO!", color: "text-red-500 font-bold", delay: 2800 },
                { text: ">> bL1nKZz7 TOP 1 ENGINE PRONTA PARA USO <<", color: "text-amber-400 font-bold", delay: 3200 }
            ];

            logsSequence.forEach((log, idx) => {
                setTimeout(() => {
                    const line = document.createElement('div');
                    line.className = log.color;
                    line.innerText = log.text;
                    terminalLogs.appendChild(line);
                    terminalLogs.scrollTop = terminalLogs.scrollHeight;

                    let percent = Math.round(((idx + 1) / logsSequence.length) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercent.innerText = percent + '%';

                    if (idx === logsSequence.length - 1) {
                        statusText.innerText = 'CONCLUÍDO COM SUCESSO!';
                        closeBtn.disabled = false;
                        closeBtn.classList.add('shadow-[0_0_15px_#dc2626]');
                    }
                }, log.delay);
            });
        }

        function closeHackerModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
